<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Inicio de sesión</title>
</head>
<body>
  <h1>Iniciar sesión</h1>

  <form action="/api/login" method="post">
    <label>Usuario:
      <input type="text" name="username" required>
    </label>

    <br><br>

    <label>Contraseña:
      <input type="password" name="password" required>
    </label>

    <br><br>

    <button type="submit">Ingresar</button>
  </form>
</body>
</html>
